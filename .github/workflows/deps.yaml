name: Dependency automation
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
env:
  RENOVATE_VERSION: 43.191.2
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Renovate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/renovate
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Fix cache permissions
        run: |
          mkdir -p /tmp/renovate
          sudo chown -R 12021:0 /tmp/renovate

      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.DEPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_DIR: /tmp/renovate
        with:
          renovate-version: ${{ env.RENOVATE_VERSION }}
          configurationFile: renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
