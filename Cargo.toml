[workspace]
resolver = "3"
members = ["core", "data-builder", "shells/tauri", "shells/web"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "=1.0.104"
crux_core = "=0.20.0"
serde = "=1.0.229"
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
thiserror = "=2.0.20"

[workspace.lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
